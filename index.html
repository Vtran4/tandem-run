<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The tandem run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14100f; }
  canvas { display: block; }
  #snd {
    position: fixed; top: 16px; right: 16px; z-index: 5;
    font: 600 14px "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    letter-spacing: .05em; color: #f2d9a8;
    background: rgba(12,10,15,.62); border: 1px solid rgba(242,217,168,.5);
    border-radius: 6px; padding: 7px 14px; cursor: pointer;
  }
  #snd:hover { background: rgba(46,36,26,.85); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="snd">Enable sound</button>
<script>
  window.__errors = [];
  window.addEventListener('error', function (e) {
    var st = e.error && e.error.stack ? String(e.error.stack).split('\n').slice(0, 5).join(' | ') : '';
    window.__errors.push((e.message || 'err') + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || 0) + (st ? ' :: ' + st : ''));
  });
</script>
<script src="src/util.js"></script>
<script src="src/config.js"></script>
<script src="src/road.js"></script>
<script src="src/cars.js"></script>
<script src="src/traffic.js"></script>
<script src="src/sprites.js"></script>
<script src="src/tracks.js"></script>
<script src="src/ai.js"></script>
<script src="src/audio.js"></script>
<script src="src/scene.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
